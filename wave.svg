<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180">
  <defs>
    <path id="star" d="M0,-8 Q1.6,-1.6 8,0 Q1.6,1.6 0,8 Q-1.6,1.6 -8,0 Q-1.6,-1.6 0,-8Z"/>
    <path id="heart" d="M0,4 C-7,-1 -5,-9 0,-5 C5,-9 7,-1 0,4Z"/>
  </defs>

  <!-- shadow -->
  <ellipse cx="125" cy="154" rx="46" ry="6" fill="#ff8fb6" opacity="0.25">
    <animate attributeName="rx" values="46;38;46" dur="2.4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- sparkles -->
  <g fill="#ffb3c6">
    <use href="#star" transform="translate(34 128) scale(0.9)">
      <animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"/>
    </use>
    <use href="#star" transform="translate(214 136) scale(0.7)">
      <animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
    </use>
    <use href="#star" transform="translate(212 28) scale(1)">
      <animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="1.2s" repeatCount="indefinite"/>
    </use>
    <use href="#star" transform="translate(98 26) scale(0.6)">
      <animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- floating hearts -->
  <g fill="#ff6fae">
    <g transform="translate(46 108)">
      <g opacity="0">
        <animateTransform attributeName="transform" type="translate" values="0 0;-4 -34" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="2.6s" repeatCount="indefinite"/>
        <use href="#heart"/>
      </g>
    </g>
    <g transform="translate(220 104) scale(0.8)">
      <g opacity="0">
        <animateTransform attributeName="transform" type="translate" values="0 0;4 -38" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
        <use href="#heart"/>
      </g>
    </g>
  </g>

  <!-- speech bubble -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="1.2s" repeatCount="indefinite"/>
    <path d="M56,50 L70,64 L64,49Z" fill="#ffe5ec" stroke="#ff8fb6" stroke-width="2" stroke-linejoin="round"/>
    <rect x="16" y="20" width="58" height="31" rx="15.5" fill="#ffe5ec" stroke="#ff8fb6" stroke-width="2"/>
    <rect x="55" y="47" width="10" height="3" fill="#ffe5ec"/>
    <text x="45" y="41" text-anchor="middle" font-family="ui-rounded, 'Quicksand', 'Varela Round', 'Nunito', sans-serif" font-size="16" font-weight="700" fill="#e0457b">hi~</text>
  </g>

  <!-- character -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="2.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>

    <!-- waving arm -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-18 178 104;22 178 104;-18 178 104" dur="0.9s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
      <ellipse cx="200" cy="74" rx="12" ry="13" fill="#ffffff" stroke="#ff8fb6" stroke-width="3"/>
      <ellipse cx="197" cy="72" rx="4" ry="2.5" fill="#ffd6e8"/>
    </g>
    <!-- wave lines -->
    <g fill="none" stroke="#ff8fb6" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0;1;0" dur="0.9s" repeatCount="indefinite"/>
      <path d="M220,58 Q227,66 222,76"/>
      <path d="M228,52 Q237,64 231,80"/>
    </g>

    <!-- resting arm -->
    <ellipse cx="63" cy="128" rx="11" ry="10" fill="#ffffff" stroke="#ff8fb6" stroke-width="3"/>

    <!-- body outline -->
    <g fill="#ff8fb6">
      <circle cx="92" cy="104" r="33"/>
      <circle cx="126" cy="84" r="41"/>
      <circle cx="160" cy="104" r="33"/>
      <rect x="69" y="93" width="114" height="52" rx="25"/>
    </g>
    <!-- body fill -->
    <g fill="#ffffff">
      <circle cx="92" cy="104" r="30"/>
      <circle cx="126" cy="84" r="38"/>
      <circle cx="160" cy="104" r="30"/>
      <rect x="72" y="96" width="108" height="46" rx="22"/>
    </g>

    <!-- bow -->
    <g fill="#fb6f92">
      <path d="M140,50 C132,39 122,45 127,54 C130,60 136,56 140,50Z"/>
      <path d="M140,50 C148,39 158,45 153,54 C150,60 144,56 140,50Z"/>
      <circle cx="140" cy="50" r="4"/>
    </g>

    <!-- cheeks -->
    <ellipse cx="99" cy="117" rx="7.5" ry="4.5" fill="#ff8fb6" opacity="0.55"/>
    <ellipse cx="153" cy="117" rx="7.5" ry="4.5" fill="#ff8fb6" opacity="0.55"/>

    <!-- eyes -->
    <g fill="#5c2a4f">
      <ellipse cx="110" cy="106" rx="4.5" ry="6">
        <animate attributeName="ry" values="6;6;0.8;6;6" keyTimes="0;0.88;0.92;0.96;1" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="142" cy="106" rx="4.5" ry="6">
        <animate attributeName="ry" values="6;6;0.8;6;6" keyTimes="0;0.88;0.92;0.96;1" dur="4s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <g fill="#ffffff">
      <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.88;0.92;0.96;1" dur="4s" repeatCount="indefinite"/>
      <circle cx="111.6" cy="103.6" r="1.7"/>
      <circle cx="143.6" cy="103.6" r="1.7"/>
    </g>

    <!-- mouth -->
    <path d="M120,114 Q123,118.5 126,114 Q129,118.5 132,114" fill="none" stroke="#5c2a4f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
